name: Platform checks
on:
  push:
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: vue_frontend/package-lock.json
      - run: python -m pip install -r requirements-lock-windows.txt
      - run: python -m pytest -q
        env:
          PYTHONUTF8: '1'
      - run: npm ci --prefix vue_frontend
      - run: npm run build --prefix vue_frontend
